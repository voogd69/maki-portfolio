<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Web Designer maki. Portfolio">
  <title>maki. | Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scroll-progress" aria-hidden="true"><span></span></div>
<div class="ambient ambient-one" aria-hidden="true"></div>
<div class="ambient ambient-two" aria-hidden="true"></div>
<header class="header shell">
  <a href="#top" class="logo">maki.</a>

  <nav class="nav">
    <a href="#about">About</a>
    <a href="#services">Service</a>
    <a href="#works">Works</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main id="top">

  <section class="hero shell reveal-group">
    <div class="hero-card panel">
      <span class="hero-badge">Web Designer</span>
      <h1 id="hero-title"></h1>
      <p id="hero-subtitle"></p>
      <a class="pink-btn" href="#works">View Works →</a>
    </div>

    <div class="hero-art">
      <img src="assets/hero-glass.jpg" alt="">
    </div>
  </section>

  <section id="about" class="about shell panel reveal">
    <div class="about-photo-wrap">
      <img id="profile-image" src="" alt="maki.">
    </div>

    <div class="about-copy">
      <h2>About me <span>•</span></h2>
      <h3 id="about-lead"></h3>
      <p id="about-text-1"></p>
      <p id="about-text-2"></p>

      <div id="facts" class="facts"></div>
    </div>
  </section>

  <section id="services" class="services shell reveal">
    <h2>What I can do <span>•</span></h2>
    <div id="service-list" class="services-grid"></div>
  </section>

  <section id="works" class="works shell panel reveal">
    <div class="works-head">
      <div>
        <h2>Works <span>•</span></h2>
        <p>制作実績</p>
      </div>

      <div id="filter-list" class="filters"></div>
    </div>

    <div id="works-grid" class="works-grid"></div>
  </section>

  <section id="contact" class="contact shell panel reveal">
    <div>
      <h2>Contact <span>•</span></h2>
      <p id="contact-text"></p>
    </div>

    <div class="contact-info">
      <a id="mail-link" href=""></a>
      <a id="instagram-link" href="#" target="_blank" rel="noopener">Instagram</a>
      <a id="x-link" href="#" target="_blank" rel="noopener">X</a>
    </div>
  </section>
</main>

<footer class="footer shell">
  <span class="logo">maki.</span>
  <p>© <span id="year"></span> maki. All Rights Reserved.</p>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
